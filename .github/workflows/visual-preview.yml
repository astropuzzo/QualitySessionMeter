name: visual preview

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-visuals:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore WPF visual harness
        run: dotnet restore QualitySessionMeter.VisualHarness/QualitySessionMeter.VisualHarness.csproj

      - name: Render real QSM WPF templates
        run: dotnet run --project QualitySessionMeter.VisualHarness/QualitySessionMeter.VisualHarness.csproj -c Release --no-restore -- artifacts/visual

      - name: Render WPF scroll slices
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -Sta -File tools/visual/render-wpf-slices.ps1 -OutputDirectory artifacts/visual

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Render actual Web Dashboard HTML
        run: node tools/visual/render-web.mjs artifacts/visual

      - name: List generated visual evidence
        shell: pwsh
        run: |
          Get-ChildItem artifacts/visual | Sort-Object Name | Format-Table Name, Length
          $pngs = Get-ChildItem artifacts/visual -Filter *.png
          if ($pngs.Count -lt 30) { throw "Expected at least 30 visual-regression PNGs, found $($pngs.Count)." }
          $required = @(
            'wpf-options-dark-slice-top.png',
            'wpf-options-dark-slice-middle.png',
            'wpf-options-dark-slice-bottom.png',
            'wpf-main-panel-dark-slice-top.png',
            'wpf-main-panel-dark-slice-middle.png',
            'wpf-main-panel-dark-slice-bottom.png',
            'web-mobile-430x932-full.png',
            'web-desktop-1440x1000-full.png'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path 'artifacts/visual' $name))) { throw "Missing visual evidence: $name" }
          }

      - name: Upload QSM visual preview
        uses: actions/upload-artifact@v4
        with:
          name: qsm-visual-preview-${{ github.sha }}
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 14
