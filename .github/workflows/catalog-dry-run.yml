name: NINA catalog dry run

on:
  push:
    branches:
      - release/1305-store-assets
    paths:
      - '.github/workflows/catalog-dry-run.yml'

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: windows-latest
    steps:
      - name: Checkout store-assets branch
        uses: actions/checkout@v4
        with:
          ref: release/1305-store-assets

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read plugin version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content QualitySessionMeter.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Plugin version not found" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore and build production plugin
        run: |
          dotnet restore QualitySessionMeter.csproj
          dotnet build QualitySessionMeter.csproj -c Release --no-restore -p:QsmDevelopmentBuild=false

      - name: Prepare production package directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.dll" "package/QualitySessionMeter.dll" -Force
          if (Test-Path "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb") {
            Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb" "package/QualitySessionMeter.pdb" -Force
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE, SECURITY.md "package/" -Force
          if (Test-Path docs) { Copy-Item docs "package/docs" -Recurse -Force }

      - name: Generate archive and manifest with official N.I.N.A. tool
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          Invoke-WebRequest "https://raw.githubusercontent.com/isbeorn/nina.plugin.manifests/main/tools/CreateManifest.ps1" -OutFile CreateManifest.ps1
          $asset = "QualitySessionMeter.$version.zip"
          $futureUrl = "https://github.com/${{ github.repository }}/releases/download/$version/$asset"
          pwsh ./CreateManifest.ps1 -file "package/QualitySessionMeter.dll" -installerUrl $futureUrl -createArchive -includeAll
          Move-Item "QualitySessionMeter.zip" $asset -Force
          Move-Item "manifest.json" "QualitySessionMeter.$version.manifest.json" -Force

      - name: Assert QSM manifest metadata
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $manifestPath = "QualitySessionMeter.$version.manifest.json"
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($m.Name -ne 'QualitySessionMeter') { throw "Unexpected manifest name: $($m.Name)" }
          if ($m.Identifier -ne 'bf861692-b3de-4fdc-8a74-d2b97434f49d') { throw "Unexpected manifest identifier: $($m.Identifier)" }
          if ($m.Author -ne 'astropuzzo') { throw "Unexpected manifest author: $($m.Author)" }
          if ($m.MinimumApplicationVersion.Major -ne 3 -or $m.MinimumApplicationVersion.Minor -ne 3 -or $m.MinimumApplicationVersion.Patch -ne 0 -or $m.MinimumApplicationVersion.Build -ne 1057) { throw "Unexpected minimum N.I.N.A. version" }
          if ($m.Installer.Type -ne 'ARCHIVE' -or $m.Installer.ChecksumType -ne 'SHA256') { throw "Unexpected installer metadata" }
          if ($m.Descriptions.FeaturedImageURL -ne 'https://raw.githubusercontent.com/astropuzzo/QualitySessionMeter/main/docs/store/featured.png') { throw "FeaturedImageURL missing or wrong" }
          if ($m.Descriptions.ScreenshotURL -ne 'https://raw.githubusercontent.com/astropuzzo/QualitySessionMeter/main/docs/store/nina-panel.png') { throw "ScreenshotURL missing or wrong" }
          if ($m.Descriptions.AltScreenshotURL -ne 'https://raw.githubusercontent.com/astropuzzo/QualitySessionMeter/main/docs/store/web-dashboard.png') { throw "AltScreenshotURL missing or wrong" }
          Write-Host ($m | ConvertTo-Json -Depth 8)

      - name: Validate manifest inside official repository
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          git clone --depth 1 https://github.com/isbeorn/nina.plugin.manifests.git manifest-validation
          $dest = "manifest-validation/manifests/Q/QualitySessionMeter/3.3.0.1057/$version"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "QualitySessionMeter.$version.manifest.json" "$dest/manifest.json" -Force
          Push-Location manifest-validation
          npm install
          node gather.js
          Pop-Location

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: qsm-catalog-dry-run-${{ steps.version.outputs.value }}
          path: |
            QualitySessionMeter.${{ steps.version.outputs.value }}.manifest.json
            QualitySessionMeter.${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14
