name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QualitySessionMeter.csproj

      - name: Build Release
        run: dotnet build QualitySessionMeter.csproj -c Release --no-restore

      - name: Upload plugin build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QualitySessionMeter-v1
          path: bin/Release/net8.0-windows7.0/
          if-no-files-found: error
