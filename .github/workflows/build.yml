name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read plugin version
        shell: pwsh
        run: |
          [xml]$project = Get-Content QualitySessionMeter.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Plugin version not found" }
          "QSM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QSM_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore plugin
        run: dotnet restore QualitySessionMeter.csproj

      - name: Gate production vs field-test source sets
        shell: pwsh
        run: |
          $prodCompile = dotnet msbuild QualitySessionMeter.csproj -p:QsmDevelopmentBuild=false -getItem:Compile
          $prodPage = dotnet msbuild QualitySessionMeter.csproj -p:QsmDevelopmentBuild=false -getItem:Page
          $prodText = $prodCompile -join "`n"
          $prodPages = $prodPage -join "`n"
          $syntheticCodePattern = 'SyntheticSessionGenerator\.cs|SyntheticConfidenceOracle\.cs|SyntheticEventOracle\.cs|SyntheticGuidePatternOracle\.cs|SyntheticTrendOracle\.cs|SyntheticLabDockable\.cs|SyntheticResources\.xaml\.cs'
          if ($prodText -match $syntheticCodePattern -or $prodPages -match 'SyntheticResources\.xaml') {
            throw "Production source set still contains Synthetic Lab code or UI."
          }

          $devCompile = dotnet msbuild QualitySessionMeter.csproj -p:QsmDevelopmentBuild=true -getItem:Compile
          $devPage = dotnet msbuild QualitySessionMeter.csproj -p:QsmDevelopmentBuild=true -getItem:Page
          $devText = $devCompile -join "`n"
          $devPages = $devPage -join "`n"
          if ($devText -notmatch 'SyntheticSessionGenerator\.cs' -or $devText -notmatch 'SyntheticConfidenceOracle\.cs' -or $devText -notmatch 'SyntheticLabDockable\.cs' -or $devPages -notmatch 'SyntheticResources\.xaml') {
            throw "Field-test source set does not contain the complete Synthetic Lab."
          }

      - name: Gate release UI and dashboard safety contracts
        shell: pwsh
        run: |
          $web = Get-Content Core/WebDashboardPage.cs -Raw
          $server = Get-Content Core/QualitySessionWebServer.cs -Raw
          $options = Get-Content UI/OptionsHelpResources.xaml -Raw
          $optionsCode = Get-Content UI/OptionsHelpResources.xaml.cs -Raw
          $resourcesCode = Get-Content UI/Resources.xaml.cs -Raw
          $controlCenterCode = Get-Content UI/ControlCenterResources.xaml.cs -Raw
          $timeline = Get-Content UI/QualityTimelineControl.cs -Raw
          $frameAxis = Get-Content UI/TimelineFrameAxisAdorner.cs -Raw

          foreach ($required in @(
            'function drawTimeline',
            'function drawGuide',
            'function drawFrameAxis',
            'function frameTickIndexes',
            'adaptive Frame # axis',
            'lastPreviewGeneration',
            'function updatePreview',
            'meta.generation',
            'const esc=',
            'Metric definitions',
            'Total error magnitude',
            'rolling 20 s'
          )) {
            if ($web -notmatch [regex]::Escape($required)) { throw "Web Dashboard release contract missing: $required" }
          }
          if ($web -match 'qualityCanvas') { throw "Legacy simplified qualityCanvas graph returned to the Web Dashboard." }
          if ($web -match "setInterval\(preview") { throw "Web preview regressed to blind periodic img reloads instead of generation-aware updates." }

          foreach ($required in @(
            'LanAddressResolver.BuildDashboardUrl',
            'Content-Security-Policy',
            'Cross-Origin-Resource-Policy',
            'MaxConcurrentClients',
            'MaxFailedLoginsPerWindow',
            'WebDashboardPage.Html'
          )) {
            if ($server -notmatch [regex]::Escape($required)) { throw "Web server hardening contract missing: $required" }
          }

          if ($options -match '<GroupBox') { throw "Plugin Options regressed to custom GroupBox/card layout instead of native N.I.N.A. rows." }
          if ($options -notmatch 'Background="\{DynamicResource BackgroundBrush\}"') { throw "Plugin Options are not bound to the active N.I.N.A. background theme." }
          if ($options -notmatch 'WebDashboardAddress, Mode=OneWay') { throw "Dashboard address must remain read-only/OneWay in Options." }

          # WPF/AvalonDock safety: never bind a shared SolidColorBrush/Freezable to a host brush.
          # A bound Freezable cannot be frozen and can crash when a dock template is materialized
          # from another dispatcher. Theme resources must be resolved on the loaded UI element.
          if ($resourcesCode -match 'BindingOperations\.SetBinding' -or $resourcesCode -match 'SolidColorBrush\.ColorProperty') {
            throw "Cross-thread unsafe SolidColorBrush binding returned to shared QSM resources."
          }
          foreach ($required in @('FreezeBrush("QsmCard")', 'SetResourceReference', 'CardLoaded', 'TimelineFrameAxisBehavior.Attach')) {
            if ($resourcesCode -notmatch [regex]::Escape($required)) { throw "WPF brush/timeline safety contract missing: $required" }
          }
          foreach ($required in @('TextAlignment = TextAlignment.Left', 'HorizontalContentAlignment = HorizontalAlignment.Left', 'ButtonForegroundBrush')) {
            if ($optionsCode -notmatch [regex]::Escape($required)) { throw "Options left-alignment/theme contract missing: $required" }
          }
          foreach ($required in @('SecondaryBackgroundBrush', 'TertiaryBackgroundBrush', 'ButtonForegroundBrush', 'SetResourceReference')) {
            if ($controlCenterCode -notmatch [regex]::Escape($required)) { throw "Control Center theme contract missing: $required" }
          }
          foreach ($required in @('FRAME #', 'FrameIndex', 'BuildTickIndexes', 'TakeLast(160)', 'IsHitTestVisible = false')) {
            if ($frameAxis -notmatch [regex]::Escape($required)) { throw "WPF frame-axis contract missing: $required" }
          }

          if ($timeline -notmatch 'PushClip') { throw "Timeline plot clipping is missing; labels/markers may overlap the graph." }
          if ($timeline -notmatch 'SecondaryBackgroundBrush' -or $timeline -notmatch 'ButtonForegroundBrush') { throw "Timeline structural colors are no longer tied to N.I.N.A. theme resources." }

      - name: Build production plugin
        run: dotnet build QualitySessionMeter.csproj -c Release --no-restore -p:QsmDevelopmentBuild=false

      - name: Package production plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/production | Out-Null
          Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.dll" "artifacts/production/QualitySessionMeter.dll" -Force
          if (Test-Path "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb") {
            Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb" "artifacts/production/QualitySessionMeter.pdb" -Force
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE, SECURITY.md "artifacts/production/" -Force
          if (Test-Path docs) { Copy-Item docs "artifacts/production/docs" -Recurse -Force }

      - name: Build field-test plugin with Synthetic Lab
        run: dotnet build QualitySessionMeter.csproj -c Release --no-restore -p:QsmDevelopmentBuild=true

      - name: Package field-test plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/field-test | Out-Null
          Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.dll" "artifacts/field-test/QualitySessionMeter.dll" -Force
          if (Test-Path "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb") {
            Copy-Item "bin/Release/net10.0-windows7.0/QualitySessionMeter.pdb" "artifacts/field-test/QualitySessionMeter.pdb" -Force
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE, SECURITY.md "artifacts/field-test/" -Force
          if (Test-Path docs) { Copy-Item docs "artifacts/field-test/docs" -Recurse -Force }

      - name: Restore synthetic checker
        run: dotnet restore QualitySessionMeter.SyntheticCheck/QualitySessionMeter.SyntheticCheck.csproj

      - name: Run full V1/V2/V3 synthetic regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/synthetic-check | Out-Null
          dotnet run --project QualitySessionMeter.SyntheticCheck/QualitySessionMeter.SyntheticCheck.csproj -c Release --no-restore -- "$PWD/artifacts/synthetic-check"

      - name: Upload production plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QualitySessionMeter-v${{ env.QSM_VERSION }}-production-nina-3.3-nightly-057
          path: artifacts/production/
          if-no-files-found: error

      - name: Upload field-test plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QualitySessionMeter-v${{ env.QSM_VERSION }}-field-test-with-synthetic-lab-nina-3.3-nightly-057
          path: artifacts/field-test/
          if-no-files-found: error

      - name: Upload synthetic-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QualitySessionMeter-v${{ env.QSM_VERSION }}-synthetic-report
          path: artifacts/synthetic-check/
          if-no-files-found: warn

      - name: Create public pre-store test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fieldZip = "QualitySessionMeter-$env:QSM_VERSION-field-test-with-synthetic-lab-nina-3.3-nightly-057.zip"
          $prodZip = "QualitySessionMeter-$env:QSM_VERSION-production-nina-3.3-nightly-057.zip"
          Compress-Archive -Path artifacts/field-test/* -DestinationPath $fieldZip -Force
          Compress-Archive -Path artifacts/production/* -DestinationPath $prodZip -Force
          if (gh release view "$env:QSM_TAG" --repo "${{ github.repository }}" *> $null) {
            Write-Host "Release $env:QSM_TAG already exists; leaving it unchanged."
          } else {
            gh release create "$env:QSM_TAG" $fieldZip $prodZip `
              --repo "${{ github.repository }}" `
              --target "$env:GITHUB_SHA" `
              --title "QualitySessionMeter $env:QSM_VERSION (pre-store test)" `
              --notes "Pre-store test release. Install the field-test-with-synthetic-lab ZIP for current validation. The production ZIP is generated in parallel to verify the future N.I.N.A. store package and intentionally excludes Synthetic Lab." `
              --latest
          }
