name: dispatcher style hotfix

on:
  push:
    branches:
      - hotfix/1306-dispatcher-style-crash
    paths:
      - '.github/workflows/dispatcher-style-hotfix.yml'
      - 'tools/dispatcher-style-hotfix.ps1'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1306-dispatcher-style-crash

      - name: Apply dispatcher-safe WPF transform
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tools/dispatcher-style-hotfix.ps1

      - name: Commit hotfix runtime files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI QualitySessionMeter.csproj CHANGELOG.md
          git commit -m "QSM 1.3.0.6: eliminate cross-dispatcher shared WPF styles"
          git push origin HEAD:hotfix/1306-dispatcher-style-crash
