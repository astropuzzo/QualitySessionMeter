name: dispatcher style hotfix

on:
  push:
    branches:
      - hotfix/1306-dispatcher-style-crash
    paths:
      - '.github/workflows/dispatcher-style-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1306-dispatcher-style-crash

      - name: Remove shared dispatcher-bound styles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Read([string]$p) { return [IO.File]::ReadAllText((Join-Path $PWD $p)) }
          function Write([string]$p, [string]$s) { [IO.File]::WriteAllText((Join-Path $PWD $p), $s, [Text.UTF8Encoding]::new($false)) }
          function Replace-Checked([string]$s, [string]$old, [string]$new, [string]$label) {
            if (-not $s.Contains($old)) { throw "Missing expected text for $label" }
            return $s.Replace($old, $new)
          }
          function Remove-Style([string]$s, [string]$key) {
            $pattern = '(?s)\s*<Style x:Key="' + [regex]::Escape($key) + '".*?</Style>\s*'
            $m = [regex]::Matches($s, $pattern)
            if ($m.Count -ne 1) { throw "Expected exactly one shared style $key, found $($m.Count)" }
            return [regex]::Replace($s, $pattern, "`r`n", 1)
          }

          # Main dockable: no shared Style objects. Root Loaded runs on AvalonDock's owning dispatcher.
          $p = 'UI/Resources.xaml'
          $s = Read $p
          $s = Remove-Style $s 'QsmCardStyle'
          $s = Remove-Style $s 'QsmSectionTitle'
          $s = $s.Replace('Style="{StaticResource QsmCardStyle}"', 'Background="{DynamicResource SecondaryBackgroundBrush}" BorderBrush="{DynamicResource BorderBrush}" BorderThickness="1" CornerRadius="8" Padding="10" Margin="0,0,0,8"')
          $s = $s.Replace('Style="{StaticResource QsmSectionTitle}"', 'Foreground="{DynamicResource ButtonForegroundBrush}" Opacity="0.78" FontSize="11" FontWeight="SemiBold" TextAlignment="Left"')
          $s = Replace-Checked $s '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled">' '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled" Loaded="DockableLoaded">' 'main dockable root Loaded'
          if ($s -match 'QsmCardStyle|QsmSectionTitle') { throw 'Shared main dockable style reference remains.' }
          Write $p $s

          # Native-style options: inline former style properties and theme/align from one root Loaded callback.
          $p = 'UI/OptionsHelpResources.xaml'
          $s = Read $p
          foreach ($k in @('QsmSectionHeader','QsmSubHeader','QsmHint','QsmOptionRow')) { $s = Remove-Style $s $k }
          $s = $s.Replace('Style="{StaticResource QsmSectionHeader}"', 'FontSize="18" FontWeight="Normal" TextAlignment="Left"')
          $s = $s.Replace('Style="{StaticResource QsmSubHeader}"', 'FontWeight="SemiBold" TextAlignment="Left"')
          $s = $s.Replace('Style="{StaticResource QsmHint}"', 'Opacity="0.72" FontSize="11" TextWrapping="Wrap" TextAlignment="Left"')
          $s = $s.Replace('Style="{StaticResource QsmOptionRow}"', 'Margin="14,2,0,2"')
          $old = '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled" Background="{DynamicResource BackgroundBrush}">'
          $new = '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled" Background="{DynamicResource BackgroundBrush}" Loaded="OptionsRootLoaded">'
          $s = Replace-Checked $s $old $new 'options root Loaded'
          if ($s -match 'QsmSectionHeader|QsmSubHeader|QsmHint|QsmOptionRow') { throw 'Shared options style reference remains.' }
          Write $p $s

          # Control Center.
          $p = 'UI/ControlCenterResources.xaml'
          $s = Read $p
          foreach ($k in @('QsmCcSectionTitle','QsmCcHelp')) { $s = Remove-Style $s $k }
          $s = $s.Replace('Style="{StaticResource QsmCcSectionTitle}"', 'FontWeight="SemiBold" FontSize="13" Margin="0,0,0,8" TextAlignment="Left"')
          $s = $s.Replace('Style="{StaticResource QsmCcHelp}"', 'Opacity="0.68" TextWrapping="Wrap" FontSize="11" TextAlignment="Left"')
          $s = Replace-Checked $s '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled">' '<ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled" Loaded="ControlCenterLoaded">' 'control center root Loaded'
          if ($s -match 'QsmCcSectionTitle|QsmCcHelp') { throw 'Shared Control Center style reference remains.' }
          Write $p $s

          # Synthetic Lab field-test UI.
          $p = 'UI/SyntheticResources.xaml'
          $s = Read $p
          $s = Remove-Style $s 'LabCardStyle'
          $s = $s.Replace('Style="{StaticResource LabCardStyle}"', 'Background="{DynamicResource SecondaryBackgroundBrush}" BorderBrush="{DynamicResource BorderBrush}" BorderThickness="1" CornerRadius="8" Padding="12" Margin="0,0,0,8"')
          $s = Replace-Checked $s '<ScrollViewer VerticalScrollBarVisibility="Auto">' '<ScrollViewer VerticalScrollBarVisibility="Auto" Loaded="SyntheticRootLoaded">' 'synthetic root Loaded'
          if ($s -match 'LabCardStyle') { throw 'Shared Synthetic Lab style reference remains.' }
          Write $p $s

          # Main dockable code-behind: remove Style EventSetter mutation and theme from root Loaded.
          $p = 'UI/Resources.xaml.cs'
          $s = Read $p
          $s = [regex]::Replace($s, '\s*AddLoadedHandler\("QsmCardStyle", CardLoaded\);\s*AddLoadedHandler\("QsmSectionTitle", SectionTitleLoaded\);', "`r`n")
          $s = [regex]::Replace($s, '(?s)\s*private void AddLoadedHandler\(string styleKey, RoutedEventHandler handler\) \{.*?\}\s*\r?\n\s*private static void SectionTitleLoaded\(.*?\}\s*\r?\n\s*private static void CardLoaded\(.*?\}\s*', "`r`n")
          $needle = '    private static void ThemeCardTree(DependencyObject root) {'
          $insert = @'
    private void DockableLoaded(object sender, RoutedEventArgs e) {
        if (sender is DependencyObject root) ThemeCardTree(root);
    }

    private static void ThemeCardTree(DependencyObject root) {
        if (root is Border border) {
            if (border.Background is SolidColorBrush bg && ColorEquals(bg.Color, 0x17, 0x1A, 0x20)) {
                border.SetResourceReference(Border.BackgroundProperty, "SecondaryBackgroundBrush");
            }
            if (border.BorderBrush is SolidColorBrush bb && ColorEquals(bb.Color, 0x2A, 0x30, 0x39)) {
                border.SetResourceReference(Border.BorderBrushProperty, "BorderBrush");
            }
        }
'@
          if (-not $s.Contains($needle)) { throw 'ThemeCardTree anchor missing' }
          $s = $s.Replace($needle, $insert.TrimEnd())
          if ($s -match 'AddLoadedHandler|CardLoaded|SectionTitleLoaded') { throw 'Style EventSetter machinery remains in Resources.xaml.cs' }
          Write $p $s

          # Options code-behind: one root Loaded callback, no Style/EventSetter mutation.
          $p = 'UI/OptionsHelpResources.xaml.cs'
          $s = Read $p
          $s = [regex]::Replace($s, '(?m)^\s*AddLoadedHandler\("QsmOptionRow".*?\r?\n\s*AddLoadedHandler\("QsmSectionHeader".*?\r?\n\s*AddLoadedHandler\("QsmSubHeader".*?\r?\n\s*AddLoadedHandler\("QsmHint".*?\r?\n', '')
          $s = [regex]::Replace($s, '(?s)\s*private void AddLoadedHandler\(string styleKey, RoutedEventHandler handler\) \{.*?\}\s*\r?\n\s*private static void OptionTextLoaded\(.*?\}\s*\r?\n\s*private static void OptionRowLoaded\(.*?\}\s*', "`r`n")
          $anchor = '    private static void ThemeAndAlign(DependencyObject root) {'
          $replacement = @'
    private void OptionsRootLoaded(object sender, RoutedEventArgs e) {
        if (sender is DependencyObject root) ThemeAndAlign(root);
    }

    private static void ThemeAndAlign(DependencyObject root) {
'@
          if (-not $s.Contains($anchor)) { throw 'Options ThemeAndAlign anchor missing' }
          $s = $s.Replace($anchor, $replacement.TrimEnd())
          if ($s -match 'AddLoadedHandler|OptionTextLoaded|OptionRowLoaded') { throw 'Style EventSetter machinery remains in OptionsHelpResources.xaml.cs' }
          Write $p $s

          # Control Center code-behind.
          $p = 'UI/ControlCenterResources.xaml.cs'
          $s = Read $p
          $s = [regex]::Replace($s, '(?s)\s*// These two styles.*?AddLoadedHandler\("QsmCcHelp", ThemeControlCenterLoaded\);', "`r`n")
          $s = [regex]::Replace($s, '(?s)\s*private void AddLoadedHandler\(string styleKey, RoutedEventHandler handler\) \{.*?\}\s*\r?\n\s*private static void ThemeControlCenterLoaded\(.*?\n\s*\}\s*\r?\n', "`r`n")
          $anchor = '    private static void ThemeTree(DependencyObject root) {'
          $replacement = @'
    private void ControlCenterLoaded(object sender, RoutedEventArgs e) {
        if (sender is DependencyObject root) ThemeTree(root);
    }

    private static void ThemeTree(DependencyObject root) {
'@
          if (-not $s.Contains($anchor)) { throw 'Control Center ThemeTree anchor missing' }
          $s = $s.Replace($anchor, $replacement.TrimEnd())
          if ($s -match 'AddLoadedHandler|ThemeControlCenterLoaded') { throw 'Style EventSetter machinery remains in ControlCenterResources.xaml.cs' }
          Write $p $s

          # Synthetic code-behind.
          $p = 'UI/SyntheticResources.xaml.cs'
          $s = Read $p
          $s = $s.Replace('        AddLoadedHandler("LabCardStyle", LabCardLoaded);' + "`r`n", '')
          $s = $s.Replace('        AddLoadedHandler("LabCardStyle", LabCardLoaded);' + "`n", '')
          $s = [regex]::Replace($s, '(?s)\s*private void AddLoadedHandler\(string styleKey, RoutedEventHandler handler\) \{.*?\}\s*\r?\n\s*private static void LabCardLoaded\(.*?\}\s*', "`r`n")
          $anchor = '    private static void ThemeTree(DependencyObject root) {'
          $replacement = @'
    private void SyntheticRootLoaded(object sender, RoutedEventArgs e) {
        if (sender is DependencyObject root) ThemeTree(root);
    }

    private static void ThemeTree(DependencyObject root) {
'@
          if (-not $s.Contains($anchor)) { throw 'Synthetic ThemeTree anchor missing' }
          $s = $s.Replace($anchor, $replacement.TrimEnd())
          if ($s -match 'AddLoadedHandler|LabCardLoaded') { throw 'Style EventSetter machinery remains in SyntheticResources.xaml.cs' }
          Write $p $s

          # Version bump.
          $p = 'QualitySessionMeter.csproj'
          $s = Read $p
          if (-not $s.Contains('1.3.0.5')) { throw 'Expected 1.3.0.5 in csproj' }
          $s = $s.Replace('1.3.0.5', '1.3.0.6')
          Write $p $s

          # Changelog entry.
          $p = 'CHANGELOG.md'
          $s = Read $p
          $entry = @'
## [1.3.0.6] - 2026-09-09

### AvalonDock dispatcher-style crash hotfix

- Fixed a real-host N.I.N.A. 3.3.0.1057 `XamlParseException` where AvalonDock materialized QSM templates on a different dispatcher and WPF rejected a shared plugin `Style` (`Style.CheckTargetType`: "The calling thread cannot access this object because a different thread owns it").
- Removed all shared keyed `Style` objects from QSM dockable/options/synthetic ResourceDictionaries. Former style properties are now local template properties; theme normalization starts from each visual root's `Loaded` event on the owning UI dispatcher.
- Removed all QSM `EventSetter`/`AddLoadedHandler` mutation of shared styles.
- Preserved N.I.N.A. theme following through `DynamicResource` and element-local `SetResourceReference`, and preserved the adaptive Frame # adorner attachment.
- Added release gates that reject reintroduction of shared keyed styles or style-mutation helpers in dispatcher-sensitive QSM UI resources.

---

'@
          $marker = '## [1.3.0.5]'
          if (-not $s.Contains($marker)) { throw '1.3.0.5 changelog marker missing' }
          $s = $s.Replace($marker, $entry + $marker)
          Write $p $s

          # Permanent CI gate: no shared keyed Style objects or EventSetter-style mutation in dispatcher-sensitive UI.
          foreach ($wf in @('.github/workflows/build.yml','.github/workflows/nina-release.yml')) {
            $s = Read $wf
            $anchor = "          `$resourcesCode = Get-Content UI/Resources.xaml.cs -Raw"
            if (-not $s.Contains($anchor)) { throw "Gate anchor missing in $wf" }
            $extra = @'
          $dispatcherSensitiveXaml = @(
            'UI/Resources.xaml',
            'UI/OptionsHelpResources.xaml',
            'UI/ControlCenterResources.xaml',
            'UI/SyntheticResources.xaml'
          )
          foreach ($xamlPath in $dispatcherSensitiveXaml) {
            if (Test-Path $xamlPath) {
              $xamlText = Get-Content $xamlPath -Raw
              if ($xamlText -match '<Style\s+x:Key=') { throw "Dispatcher-sensitive shared keyed Style found in $xamlPath" }
            }
          }
          foreach ($codePath in @('UI/Resources.xaml.cs','UI/OptionsHelpResources.xaml.cs','UI/ControlCenterResources.xaml.cs','UI/SyntheticResources.xaml.cs')) {
            if (Test-Path $codePath) {
              $codeText = Get-Content $codePath -Raw
              if ($codeText -match 'AddLoadedHandler\(' -or $codeText -match 'EventSetter\(') { throw "Cross-dispatcher Style mutation helper found in $codePath" }
            }
          }
'@
            $s = $s.Replace($anchor, $anchor + "`r`n" + $extra.TrimEnd())
            Write $wf $s
          }

          # Global assertions before commit.
          foreach ($x in @('UI/Resources.xaml','UI/OptionsHelpResources.xaml','UI/ControlCenterResources.xaml','UI/SyntheticResources.xaml')) {
            $t = Read $x
            if ($t -match '<Style\s+x:Key=') { throw "Shared keyed Style still present in $x" }
          }

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UI QualitySessionMeter.csproj CHANGELOG.md .github/workflows/build.yml .github/workflows/nina-release.yml
          git commit -m "QSM 1.3.0.6: eliminate cross-dispatcher shared WPF styles"
          git push origin HEAD:hotfix/1306-dispatcher-style-crash
