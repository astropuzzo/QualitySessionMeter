name: finalize QSM store artwork

on:
  push:
    branches:
      - release/1310-nina-catalog

permissions:
  contents: write

concurrency:
  group: qsm-final-store-artwork
  cancel-in-progress: true

jobs:
  render-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1310-nina-catalog
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render current QSM WPF and Web UI
        shell: pwsh
        run: |
          dotnet restore QualitySessionMeter.VisualHarness/QualitySessionMeter.VisualHarness.csproj
          dotnet restore QualitySessionMeter.VisualSlices/QualitySessionMeter.VisualSlices.csproj
          dotnet run --project QualitySessionMeter.VisualHarness/QualitySessionMeter.VisualHarness.csproj -c Release --no-restore -- artifacts/visual
          dotnet run --project QualitySessionMeter.VisualSlices/QualitySessionMeter.VisualSlices.csproj -c Release --no-restore -- artifacts/visual
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node tools/visual/render-web.mjs artifacts/visual
      - name: Prepare catalog screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/store | Out-Null
          Copy-Item artifacts/visual/wpf-main-panel-dark-slice-top.png docs/store/nina-panel.png -Force
          Copy-Item artifacts/visual/web-desktop-1440x1000-top.png docs/store/web-dashboard.png -Force

          Add-Type -AssemblyName PresentationCore
          Add-Type -AssemblyName WindowsBase
          $size=512
          $visual=[System.Windows.Media.DrawingVisual]::new()
          $dc=$visual.RenderOpen()
          try {
            $bg=[System.Windows.Media.SolidColorBrush]::new([System.Windows.Media.ColorConverter]::ConvertFromString('#171A20'))
            $accent=[System.Windows.Media.SolidColorBrush]::new([System.Windows.Media.ColorConverter]::ConvertFromString('#8AB4F8'))
            $bg.Freeze(); $accent.Freeze()
            $dc.DrawRoundedRectangle($bg,$null,[System.Windows.Rect]::new(8,8,496,496),72,72)
            $g=[System.Windows.Media.GeometryGroup]::new()
            $g.Children.Add([System.Windows.Media.EllipseGeometry]::new([System.Windows.Point]::new(32,32),29,29))
            $g.Children.Add([System.Windows.Media.Geometry]::Parse('M 10,38 C 16,19 28,13 32,13 C 42,13 51,22 55,35'))
            $g.Children.Add([System.Windows.Media.Geometry]::Parse('M 32,32 L 47,22'))
            $t=[System.Windows.Media.TransformGroup]::new()
            $t.Children.Add([System.Windows.Media.ScaleTransform]::new(6.35,6.35))
            $t.Children.Add([System.Windows.Media.TranslateTransform]::new(52.8,52.8))
            $g.Transform=$t
            $pen=[System.Windows.Media.Pen]::new($accent,13)
            $pen.StartLineCap=[System.Windows.Media.PenLineCap]::Round
            $pen.EndLineCap=[System.Windows.Media.PenLineCap]::Round
            $pen.LineJoin=[System.Windows.Media.PenLineJoin]::Round
            $dc.DrawGeometry($null,$pen,$g)
          } finally { $dc.Close() }
          $bmp=[System.Windows.Media.Imaging.RenderTargetBitmap]::new($size,$size,96,96,[System.Windows.Media.PixelFormats]::Pbgra32)
          $bmp.Render($visual)
          $enc=[System.Windows.Media.Imaging.PngBitmapEncoder]::new()
          $enc.Frames.Add([System.Windows.Media.Imaging.BitmapFrame]::Create($bmp))
          $fs=[System.IO.File]::Create((Resolve-Path docs/store).Path + '\featured.png')
          try { $enc.Save($fs) } finally { $fs.Dispose() }

          $storeReadme = @(
            '# N.I.N.A. catalog artwork',
            '',
            'These are the presentation assets for the official QualitySessionMeter manifest.',
            '',
            '- `featured.png`: QSM meter mark rendered from the same geometry used by the plugin icon.',
            '- `nina-panel.png`: actual current QSM WPF monitoring DataTemplate rendered by the Windows visual harness.',
            '- `web-dashboard.png`: actual current embedded Web Dashboard rendered in Chromium with deterministic telemetry and LIGHT-preview responses.',
            '',
            'They are regenerated from the release source and are not hand-drawn UI mockups. Real N.I.N.A. host validation was completed before the first catalog release.'
          )
          $storeReadme | Set-Content docs/store/README.md
      - name: Commit generated artwork to release branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/store
          if (git diff --cached --quiet) { Write-Host 'Store artwork already current'; exit 0 }
          git commit -m 'Add final NINA catalog artwork for 1.3.1.0'
          git push origin HEAD:release/1310-nina-catalog
