name: WPF dispatcher boundary

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-dispatcher-template-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dispatcher boundary checker
        run: dotnet restore QualitySessionMeter.DispatcherCheck/QualitySessionMeter.DispatcherCheck.csproj

      - name: Materialize QSM templates across two STA dispatchers
        run: dotnet run --project QualitySessionMeter.DispatcherCheck/QualitySessionMeter.DispatcherCheck.csproj -c Release --no-restore
